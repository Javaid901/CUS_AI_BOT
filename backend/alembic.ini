# Alembic configuration for the CUS AI Assistant (Phase 3C-2).
#
# The database URL is NOT stored here. env.py resolves it at runtime from:
#   1. the ALEMBIC_DATABASE_URL environment variable (explicit override), else
#   2. app.config.settings.DATABASE_URL (the application's own setting).
# This keeps credentials out of version control and makes it impossible for an
# `alembic upgrade` to silently target an unexpected database.
#
# SQLite remains the default application database. Alembic is introduced as the
# authoritative production schema-migration mechanism for PostgreSQL.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is resolved programmatically in alembic/env.py.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
